name: treino diário

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install fonttools brotli
      - run: python3 scripts/gerar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL: ${{ github.repository_owner }}
      - name: salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "treino diário: floresta atualizada" && git push; }
